# Dependabot opens a pull request each week for every update, so CI checks it before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays below 6.1: typescript-eslint needs the JavaScript API that TypeScript 7 does not have.
      # Remove this when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
