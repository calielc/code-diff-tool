name: Audit

on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json]
  pull_request:
    paths: [package.json, package-lock.json]
  schedule:
    # A new advisory can appear without any change in the repository. Run every Monday at 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The packages that ship in the app. A finding of high severity or more fails the run.
      - name: Audit production packages
        run: npm audit --omit=dev --audit-level=high
      # The build tools. A finding here is a warning only, because a fix does not always exist.
      - name: Audit all packages
        run: npm audit --audit-level=high
        continue-on-error: true
